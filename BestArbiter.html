<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>referee — FIDE 6.9 coverage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#ccc;--dark:#854;--light:#cb8;--hit:#c91;--ink:#221a12;--dim:#574838;--del:#e59a86;--ins:#a4cd6c;
      --bad:#8a1010;--good:#4f7a2a;--paper:#d8d3c8;--focus:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif;padding:30px 18px 80px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:29px;font-weight:normal;margin:0 0 4px}
h2{font-size:20px;font-weight:normal;margin:40px 0 12px;border-bottom:2px solid var(--dark);padding-bottom:5px}
h3{font-size:16px;font-weight:normal;margin:0 0 8px}
h4{font-size:15px;font-weight:600;margin:20px 0 6px}
.sub{color:var(--dim);margin:0;font-size:15px;max-width:62ch}
code,.mono,td,th,input,select,button,textarea,.fenbox,.stag{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
code{font-size:.92em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
.db{color:var(--dim);font-size:12.5px}
.legend{font-size:13.5px;color:var(--dim);margin:4px 0 10px;max-width:80ch}
.scroll{overflow-x:auto}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.ctl label{display:flex;gap:8px;align-items:center}
select{padding:5px 8px;border:1px solid var(--dark);background:#fff;font-size:13px;color:var(--ink)}
select[disabled],input[disabled],textarea[disabled]{opacity:.55}

/* input */
.input{background:var(--light);padding:18px 18px 14px}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.col>.h3{display:block;font-size:16px;margin:0 0 8px}
textarea{width:100%;min-height:118px;padding:9px 10px;border:1px solid var(--dark);background:#fff;font-size:13px;line-height:1.6;resize:vertical;color:var(--ink)}
.hint{font-size:13px;color:var(--dim);margin:6px 0 0}
.drop{border:2px dashed var(--dark);background:var(--paper);padding:20px 16px;text-align:center;cursor:pointer;transition:background .15s}
.drop:hover,.drop.over{background:#e8d9a8}
.drop.off{opacity:.55;cursor:default}
.drop strong{display:block;font-size:16px;font-weight:normal;margin-bottom:6px}
.drop small{font-size:12.5px;color:var(--dim);display:block}
.flist{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.flist li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px solid #b9a77a}
.flist .fname{font-family:ui-monospace,Menlo,monospace;font-weight:600;word-break:break-all}
.flist .fmeta{color:var(--dim)}
.flist .fref{margin-left:auto;color:var(--dim)}
.flist .clr{border:0;justify-content:flex-end}
.flist .x{border:0;background:transparent;color:var(--ink);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
.flist .x:hover{color:var(--bad)}
button.link{border:0;background:none;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.assume{margin:16px 0 10px;padding:10px 14px;background:#f1ead4;border-left:5px solid var(--hit);font-size:14px}
.assume b{font-weight:600}
.assume p{margin:3px 0 0;max-width:86ch}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 0;font-size:14px}
.opts label,.opts .rng{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
input[type=number]{width:84px;padding:4px 6px;border:1px solid var(--dark);background:#fff;color:var(--ink)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--dark)}
button{padding:8px 18px;border:1px solid var(--ink);background:var(--dark);color:#fff;cursor:pointer;font-size:14px}
button:hover{background:#6c3f33} button[disabled]{opacity:.45;cursor:default}
button.ghost,a.btn{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:6px 12px;font-size:13px;text-decoration:none;display:inline-block;font-family:ui-monospace,Menlo,monospace}
button.ghost:hover,a.btn:hover{background:var(--hit)}
.gorow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}
button.primary{font-size:16px;padding:11px 26px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.01em}
button.primary.stop{background:var(--bad)}
.stat{font-size:14px;color:var(--ink);max-width:70ch}
.bar{height:6px;background:var(--paper);margin:12px 0 0;display:none}
.bar i{display:block;height:100%;width:0;background:var(--hit);transition:width .2s}

/* outcome summary */
.obar{display:flex;height:22px;margin:6px 0 14px;background:var(--paper)}
.seg{display:block;min-width:3px}
.o-draw{background:var(--ins)} .o-mate{background:var(--dark)} .o-bad{background:#8d8d8d}
.o-open{background:repeating-linear-gradient(135deg,var(--light) 0 6px,#b9a77a 6px 8px)}
.okey{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:760px){.okey{grid-template-columns:1fr}}
.ok1{display:flex;gap:10px;align-items:flex-start}
.ok1 .sw{flex:0 0 16px;height:16px;margin-top:9px;border:1px solid rgba(0,0,0,.25)}
.ok1 .big{font-size:26px;font-weight:normal;font-family:Georgia,serif}
.ok1 .olab{font-size:15px}
.ok1 p{margin:2px 0 0;font-size:13px;color:var(--dim)}
#certbox h3{margin:22px 0 4px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--light)}
th{color:var(--dim);font-weight:normal;border-bottom:2px solid var(--dark)}
th:first-child,td:first-child,.lf{text-align:left}
td.lf{font-family:Georgia,serif;font-size:14px}
tr.tot td{border-top:2px solid var(--dark);font-weight:bold}
tr.act td{background:var(--light)}
td .db{font-size:11.5px}
.badn{color:var(--bad);font-weight:bold}

/* reference matrix */
.mx{table-layout:fixed;min-width:560px}
.mx th small{display:block;font-size:11.5px;color:var(--dim)}
.mx th small{font-family:Georgia,serif}
.mx th{vertical-align:bottom;text-align:center}
.mx th.lf{text-align:left;vertical-align:middle;font-family:Georgia,serif;font-size:14px;color:var(--ink)}
.mx td{text-align:center;padding:14px 8px;border:2px solid var(--bg)}
.mx td b{display:block;font-size:24px;font-weight:normal;font-family:Georgia,serif}
.mx td span{font-size:12px}
.c-ok{background:var(--ins)} .c-okd{background:#cfe0b4} .c-miss{background:var(--hit)}
.c-false{background:var(--bad);color:#fff} .c-contra{background:var(--del)}
.mx td.zero{background:transparent;color:var(--dim);outline:1px dashed #a99}
.note{border-left:4px solid var(--dark);padding:6px 0 6px 14px;margin:12px 0;font-size:14px;max-width:86ch}
.note.good{border-color:var(--good)} .note.bad{border-color:var(--bad)} .note.warn{border-color:var(--hit)}

/* browse */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{background:var(--light);color:var(--ink);display:block;padding:8px;border:0;border-top:5px solid var(--light);text-align:left;cursor:zoom-in;font:inherit}
.card:hover{background:#d8c08e}
.card.o-draw{border-top-color:var(--good)} .card.o-mate{border-top-color:var(--dark)} .card.o-open{border-top-color:var(--hit)} .card.o-bad{border-top-color:#8d8d8d}
.card.r-false{outline:3px solid var(--bad)} .card.r-contra{outline:3px solid var(--del)}
.meta{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.5;margin-top:6px;word-break:break-all}
.meta .code{font-size:13px}
.meta .rc{color:var(--bad)}
.pg{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;font-size:13px;flex-wrap:wrap}

/* boards */
.bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1}
.bd i{position:relative;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif}
.bd i.d{background:var(--dark)} .bd i.l{background:var(--light)} .bd i.w{color:#fff;text-shadow:0 0 1px #000,0 0 1px #000,0 0 1px #000}
.bd i.fk{box-shadow:inset 0 0 0 3px var(--hit)}
.bd.big i{font-size:32px}
.bd.big i.fk{box-shadow:inset 0 0 0 4px var(--hit)}
.bd s{position:absolute;text-decoration:none;font:10px/1 ui-monospace,Menlo,monospace;color:var(--ink);opacity:.75;text-shadow:none}
.bd i.d s{color:#f3e7cf}
.bd s.rk{top:2px;left:3px} .bd s.fl{bottom:2px;right:3px}

/* detail */
#solo{margin-top:26px}
.detail{display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:start}
@media(max-width:820px){.detail{grid-template-columns:1fr}.dboard{max-width:360px}}
.dboard .cap{font-size:13px;color:var(--dim);margin:6px 0 0}
.vhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.verdict{font-size:38px;font-family:ui-monospace,Menlo,monospace;letter-spacing:-.02em;line-height:1;margin-right:6px}
.tag{display:inline-block;padding:3px 10px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.tag.o-mate{color:#fff}
.tag.r-ok,.tag.r-okd{background:var(--ins)} .tag.r-miss{background:var(--hit)} .tag.r-false{background:var(--bad);color:#fff} .tag.r-contra{background:var(--del)}
.vtext{font-size:16px;margin:10px 0 0;max-width:62ch}
.steps{list-style:none;counter-reset:st;padding:0;margin:8px 0 0}
.steps li{counter-increment:st;position:relative;padding:6px 10px 6px 40px;border-left:4px solid #b3a99a;margin:0 0 6px;background:rgba(255,255,255,.18)}
.steps li::before{content:counter(st);position:absolute;left:10px;top:7px;font:13px/1 ui-monospace,Menlo,monospace;color:var(--dim)}
.steps .sh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.steps .sh b{font-weight:600}
.steps p{margin:2px 0 0;font-size:14px}
.stag{font-size:11.5px;padding:1px 7px;background:var(--paper);margin-left:auto}
.st-dec{border-left-color:var(--good)!important;background:rgba(164,205,108,.35)!important}
.st-dec .stag{background:var(--ins)}
.st-open{border-left-color:var(--hit)!important;background:rgba(204,153,17,.18)!important}
.st-open .stag{background:var(--hit)}
.st-skip,.st-na,.st-also{opacity:.72}
dl.kv{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:3px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--dim)}
dl.kv dd{margin:0}
dd.r-false{color:var(--bad);font-weight:600}
.fenbox{font-size:12.5px;background:var(--light);padding:8px 10px;word-break:break-all;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* dialog */
.lb{position:fixed;inset:0;background:rgba(20,18,14,.72);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:3vh 14px;overflow-y:auto}
.lbin{background:var(--bg);border:1px solid var(--dark);padding:0 20px 22px;max-width:1040px;width:100%}
.lbbar{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--dark);margin-bottom:16px;z-index:1}
.lbbar #lbpos{font-size:13px;color:var(--dim)}
.lbbar #lbx{margin-left:auto}

/* codes, diff */
details.fold{margin:30px 0 0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:9px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary>h2{margin:0;flex:1}
details.fold>summary::before{content:"\25B8";color:var(--dim);font-size:13px}
details.fold[open]>summary::before{content:"\25BE"}
details.fold .foldbody{margin-top:10px}
.codes td{text-align:left;vertical-align:top;font-family:Georgia,serif;font-size:13.5px;width:33%;border:2px solid var(--bg);background:var(--paper)}
.codes td.here,.sw2.here{background:var(--light);outline:2px solid var(--dark);outline-offset:-2px}
.sw2{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.fn{margin:20px 0 0}
.fn h3{font-size:15px}
.fnote{font-size:13px;color:var(--dim);margin:0 0 5px}
.dif{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.75;background:var(--light);padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:0}
.dif del{background:var(--del);text-decoration:none;padding:1px 0}
.dif ins{background:var(--ins);text-decoration:none;padding:1px 0}
.key{font-size:12.5px;color:var(--dim);margin:2px 0 14px}
.key del{background:var(--del);text-decoration:none;padding:1px 3px}
.key ins{background:var(--ins);text-decoration:none;padding:1px 3px}
.src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.7;background:var(--light);padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
footer{margin-top:50px;font-size:12.5px;color:var(--dim);border-top:1px solid var(--dark);padding-top:12px;max-width:100ch}
.pdet{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-start}
.pdet>.bd{flex:0 0 auto;width:min(360px,100%)}
.pdet>div:last-child{flex:1 1 320px;min-width:0}
#pgntab td{white-space:nowrap}
#pgntab td:nth-child(2),#pgntab td:nth-child(3),#pgntab td:last-child,#pgntab th:nth-child(2),#pgntab th:nth-child(3),#pgntab th:last-child{text-align:left}
#pgntab td:last-child{white-space:normal;font-family:Georgia,serif;font-size:13.5px}
.mvs{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:2;max-width:100ch}
.mvs .n{color:var(--dim);margin-right:2px}
.mvs .e{background:var(--hit);padding:1px 4px}
.mvs .a{color:var(--dim);text-decoration:line-through}
.mvs .x{color:var(--bad);font-weight:bold;text-decoration:underline}
#pgnsec{margin-top:44px}
#pgntab tr[data-pk]{cursor:pointer}
#pgntab tr.act td{background:var(--light)}
#pgntab tr.pc-lateDP td:last-child,#pgntab tr.pc-lateRule td:last-child,#pgntab tr.pc-wrongtm td:last-child,#pgntab tr.pc-wrongres td:last-child{color:var(--bad);font-weight:bold}
#pgntab tr.pc-ok td:last-child{color:var(--good)}
#pgntab tr.pc-illegal td:last-child,#pgntab tr.pc-unread td:last-child{color:var(--dim)}
#pgnsum table{width:auto;margin:6px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header class="top">
  <div>
    <h1 data-i="h1">referee — FIDE 6.9 coverage</h1>
    <p class="sub" data-i="sub"></p>
  </div>
  <div class="ctl">
    <label><span data-i="lblEngine">build</span>
      <select id="eng">
        <option value="x4" data-i="optX4">LUX — fast</option>
        <option value="nm" data-i="optNm">LUX — normal</option>
        <option value="l3x4" data-i="optL3x4">L3 — fast</option>
        <option value="l3nm" data-i="optL3nm">L3 — normal</option>
      </select></label>
    <label><span data-i="lblLang">language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select></label>
    <span class="db" id="engnote"></span>
  </div>
</header>

<section class="input">
  <div class="two">
    <div class="col">
      <label class="h3" for="fen" data-i="hPos">Positions</label>
      <textarea id="fen" rows="5" spellcheck="false" autocomplete="off" aria-describedby="poshint" placeholder="5b2/p7/Pp3k2/1Pp1pBp1/2P1P1P1/5K2/8/8 w - -"></textarea>
      <p class="hint" id="poshint"><span data-ihtml data-i="posHint"></span> <button class="link" id="example" data-i="useEx"></button></p>
    </div>
    <div class="col">
      <h3 data-i="hFiles">Files</h3>
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong data-i="dropBig"></strong>
        <small data-ihtml data-i="dropSmall"></small>
      </div>
      <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" multiple class="hide">
      <ul class="flist" id="flist"></ul>
    </div>
  </div>

  <div class="assume" role="note">
    <b data-i="assumeH"></b>
    <p data-ihtml data-i="assume"></p>
    <p class="hide" id="assumeBoth" data-i="assumeBoth"></p>
  </div>

  <div class="opts">
    <label><span data-i="lblPly">ply ceiling</span> <input type="number" id="ply" value="99" min="1" max="150"></label>
    <label><span data-i="lblBud">node budget</span> <input type="number" id="bud" value="50000" min="100" step="500"></label>
    <span class="db" id="limnote"></span>
  </div>
  <div class="opts">
    <span class="rng"><label for="rowA" data-i="lblRange">positions</label> <input type="number" id="rowA" value="1" min="1" step="100">
      <label for="rowB" data-i="lblRangeTo">to</label> <input type="number" id="rowB" value="0" min="0" step="100">
      <span class="db" data-i="lblRangeNote"></span></span>
  </div>
  <div class="opts hide" id="labrow">
    <span data-i="lblLab">labels</span> <span id="labs" class="opts" style="margin:0"></span>
    <label><input type="checkbox" id="bothdir"> <span data-i="lblBoth">judge both flags</span></label>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="cmpchk"> <span data-i="lblCmp"></span></label>
  </div>
  <div class="gorow">
    <button id="go" class="primary"></button>
    <span class="db" id="split"></span>
    <span class="stat" id="stat" aria-live="polite"></span>
  </div>
  <div class="bar" id="bar"><i id="barf"></i></div>
</section>

<section id="solo" class="hide"></section>

<section id="cmp" class="hide">
  <h2 data-i="secCmp"></h2>
  <p class="note" id="cmpnote"></p>
  <div class="scroll"><table id="cmptab"></table></div>
</section>

<section id="out" class="hide">
  <h2 data-i="secResults"></h2>
  <div id="outcome"></div>
  <div id="certbox"><h3 data-i="secCert"></h3><div class="scroll"><table id="cert"></table></div></div>

  <h2 data-i="secRef"></h2>
  <div id="refbox"></div>

  <h2 data-i="secPer"></h2>
  <div class="scroll"><table id="perfile"></table></div>

  <h2 data-i="secCost"></h2>
  <div class="scroll"><table id="cost"></table></div>

  <h2 data-i="secBrowse"></h2>
  <p class="legend" data-i="browseNote"></p>
  <div class="opts" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="pg" id="pg"></div>

  <h2 data-i="secExp"></h2>
  <div class="opts">
    <button class="ghost" id="expUn" data-i="expUn"></button>
    <button class="ghost" id="expMate" data-i="expMate"></button>
    <button class="ghost" id="expMiss" data-i="expMiss"></button>
    <button class="ghost" id="expBad" data-i="expBad"></button>
    <button class="ghost" id="expInv" data-i="expInv"></button>
    <button class="ghost" id="expAll" data-i="expAll"></button>
  </div>
  <p class="legend" data-ihtml data-i="expNote"></p>
</section>

<section class="input" id="pgnsec">
  <h2 data-i="secPgn"></h2>
  <p class="legend" data-ihtml data-i="pgnSub"></p>
  <div class="two">
    <div class="col">
      <label class="h3" for="pgntext" data-i="pgnHPaste"></label>
      <textarea id="pgntext" rows="5" spellcheck="false" autocomplete="off" placeholder='[Result "0-1"]&#10;1. f3 e5 2. g4 Qh4# 0-1'></textarea>
    </div>
    <div class="col">
      <h3 data-i="hFiles"></h3>
      <div class="drop" id="pdrop" tabindex="0" role="button">
        <strong data-i="pgnDropBig"></strong>
        <small data-ihtml data-i="pgnDropSmall"></small>
      </div>
      <input type="file" id="pfile" accept=".pgn,application/x-chess-pgn,text/plain" multiple class="hide">
      <ul class="flist" id="pgnflist"></ul>
    </div>
  </div>
  <div class="gorow">
    <button id="pgngo" class="primary"></button>
    <span class="stat" id="pstat" aria-live="polite"></span>
  </div>
  <div class="bar" id="pbar"><i id="pbarf"></i></div>
  <div id="pgnout" class="hide">
    <div class="scroll" id="pgnsum"></div>
    <div class="opts"><label><span data-i="pgnFilt"></span> <select id="pgnfilt"></select></label>

 diffSub:"İki dosya da birebir gömülü. Aşağıdaki tablo ve fark, sayfa açılırken o iki kaynaktan hesaplanıyor; yani okuduğunuz şey birebir çalışan şey.",

 diffKey:"<del>kırmızı</del> — yalnız <code>engine.js</code>’de (kısa) &nbsp;·&nbsp; <ins>yeşil</ins> — yalnız <code>engine_4x.js</code>’de (hız). İşaretsiz olan her şey ortak.",
 wJ:"Kilit dedektörü: FIDE 5.2.2 için <code>Z</code>’den (materyal testi <code>I</code>’nin yanında), 6.9 için <code>H</code>’den çağrılıyor. Piyon konileri <code>C</code>/<code>Z</code>’yi, şah selleri <code>K</code>/<code>L</code>’yi, alınabilirlik kümeleri <code>r</code>/<code>q</code>’yu ve fil selleri <code>R</code>/<code>c</code>’yi büyütüp kalıcı olarak tıkalı piyonlar <code>P</code>/<code>Q</code>’yu daraltarak bir sabit noktaya götürüyor; sonra bir piyonun terfi edip edemeyeceğini, taş alıp alamayacağını ya da şah çekip çekemeyeceğini, donmuş varsayılan şahın gerçekten donmuş olup olmadığını, kutulu bir at, kale ya da vezirin kaçıp kaçmadığını (rakip şahın ya da filin ulaştığı kutulu taş kaçmış sayılmaz: hiçbir şey alamaz, <code>F</code>/<code>g</code>’den düşer ve karesi o andan sonra boş sayılır) ve fil katmanının tutup tutmadığını soruyor. Kısa sürüm gevşetmeyi sabit 768 tur koşuyor. Hız sürümü <code>C+Z+K+L+r+q-P-Q+R+c-F-g</code> toplamını tutuyor ve toplam kıpırdamayı bıraktığı anda duruyor. Bu on iki küme yalnızca tek yönde hareket ediyor — sekizi büyüyor; <code>P</code>, <code>Q</code> ve kutulu kümeler <code>F</code>/<code>g</code> küçülüyor, eksi işaretle girmelerinin nedeni bu — dolayısıyla toplam, bir şeyi değiştiren her turda değişiyor ve yalnızca sabit noktada duruyor; döngü asla erken bitemez. On sel ve piyon maskesi toplamda en fazla 640 bit, <code>F</code>/<code>g</code> ise yalnız at, kale ve vezir karelerini değiştirebildiği için kısa sürümün 768 turu da her zaman yakınsıyor. Gerçek oyunlarda hız sürümü medyan 11 turda duruyor (chasolver verisinin ilk 20.000 oyununda en fazla 29). Toplamın durulabilmesi için hız sürümü yukarı doğru büyüyen iki küme <code>C</code> ve <code>q</code>’yu <code>&amp;f</code> ile 64 bite geri kırpıyor; kırpmasa sekizinci sıranın ötesine itilen bitler toplamı sonsuza dek kıpırdatırdı. Kısa sürümün kırpmaya ihtiyacı yok: 768 turdan sonra zaten duruyor ve o bitler hiçbir hükmü değiştirmiyor — <code>q</code>’yu sekizinci sıranın üstünde okuyan bir şey yok, oraya ulaşan bir koni de terfi testine çoktan takılmış oluyor. Hız sürümü sabit noktadan önce hızlı eleyen iki ucuz kontrol yapıyor: kendi piyonlarının ve kutulu taşlarının tutmadığı bir adım karesi olan kutulu at, kale ya da vezir ve, donmuş şah seviyelerinde, komşu karelerinden biri ne kendi taşlarınca tutulan ne de rakip piyonca görülen şah. Köşegen adımı <code>T</code> <code>s&amp;&amp;</code> ile açılıyor, böylece boş bir küme — fili olmayan taraf — hemen geri dönüyor; <code>S</code>, kısa sürümün toplamayla (<code>s+s</code>) yaptığını kaydırmayla (<code>s&lt;&lt;1n</code>) yapıyor; fil katmanında da <code>&amp;</code>/<code>|</code>, <code>&amp;&amp;</code>/<code>||</code> oluyor, yani sonuç belli olunca geri kalanı atlanıyor.",
 wG:"Piyon dalı. Hız sürümü taş kodunu <code>g=b[i]</code>’de tutuyor ve piyon dalını <code>h?</code> ile açıyor; <code>T|b[f]</code> yalnızca o dalın içinde okunuyor. Kısa sürüm <code>b[i]</code>’yi iki kez okuyor ve alma ile itişin ortak sorusu <code>x=T|b[f]</code>’yi başlıkta, yani her çağrıda hesaplıyor. İki tercih hız sürümüne birer bayta mal oluyor, karşılığında sırasıyla yaklaşık %7 ve %10 kazandırıyor. O dalın içinde <code>h</code> en az 1 olduğu için hız sürümü çapraz adımı <code>d&lt;2&amp;v</code> ile sınıyor — kısa sürümün <code>h*v==1</code>’inden bir bayt kısa, hızı aynı. Kısa sürüm bunu kullanamaz: onun alma testi <code>h?</code>’nin arkasında değil, orada <code>d&lt;2&amp;v</code> tek karelik düz itişi de kabul ederdi.",
 wV:"<code>p&amp;&amp;</code> koruması: boş kare saldırı taramasından hemen çıkıyor. Koruma olmasa <code>p&amp;1^s</code> düpedüz <code>s</code>’ye iniyor; <code>s</code> 1 olduğunda kısa sürüm her boş kareyi, yalnızca yanlış dönebilecek tam bir <code>G</code> çağrısından geçiriyor. <code>V</code> her şah testinde 64 kareye kadar tarıyor. İkinci bir koruma, <code>(p&lt;8|a(i-u)&lt;18)</code>, indekste 17 kareden uzaktaki piyon, at ve şahı atlıyor — hiçbiri o kadar uzağa ulaşamaz — yani tahtanın öbür ucundan yalnızca kayan taşlara soruluyor.",
 wL:"<code>map</code> yerine <code>forEach</code>: <code>map</code>’in ayırmak ve hemen atmak zorunda olduğu 64 elemanlık sonuç dizisi hiç kurulmuyor. Her legal hamle üretiminde bir tahsis eksiliyor. <code>forEach</code> <code>undefined</code> döndürdüğü için hız sürümü <code>||q</code> ile bitiyor; <code>map</code>’i dizi döndüren kısa sürüm ise <code>&amp;&amp;q</code> ile. Tahta kopyasını iki sürüm de burada almıyor, ikisi de bunu <code>M</code>’e bırakıyor. Derli toplu sürüm <code>c</code>’yi de kaydedip geri yazıyor, çünkü onun <code>M</code>’i bunu değiştiriyor.",
 wM:"Rok hakları. Derli toplu sürümde <code>M</code>’in kendisi, kalkış ve varış karelerinin düşürdüğü hakları siliyor (<code>c&amp;=~C(i)&amp;~C(f)</code>); böylece her çağıran bedavaya alıyor: <code>A</code> kendi kopyasını bırakıyor, aramaya da ek kod gerekmiyor. 11 bayt ucuza geliyor, ama satır bu kez <code>L</code>’nin denediği her sözde-legal hamlede de çalışıyor, gerekenin kabaca iki katı sıklıkta. 833 pozisyonluk ölçümde bedeli yaklaşık %3. İki sürüm de tahta kopyasını <code>M</code>’in kendi parametre listesinde alıyor (<code>p=(b=[...b])[i]</code>); böylece hiçbir çağıran — <code>L</code>, arama ya da <code>A</code> — kendi kopyasını almak zorunda kalmıyor. İki sürümün <code>M</code>’i yalnızca rok satırında ayrılıyor.",
 wA:"<code>M</code>’deki değişikliğin aynası: derli toplu sürüm <code>c&amp;=~C(i)&amp;~C(f)</code> satırını <code>A</code>’dan atıyor, çünkü <code>M</code> zaten yapmış oluyor; hız sürümü satırı burada tutuyor, böylece <code>M</code> saf bir tahta işlemi olarak kalıyor.",

 wX:"FIDE 6.9 yardımcı-mat araması. İki sürüm de transpozisyon kesmesinin hemen ardından <code>l</code>’ye danışıyor: kilitli bir düğüm, altında mat olmadığının belgesi — tıpkı <code>Im</code>’nin materyal için yaptığı gibi. Zorunlu bir cevaptan sonra ölüleşen pozisyonların doğru yargılanmasını sağlayan şey bu. Kısa sürüm “sırası gelen şahta değil” testini <code>v</code>’nin parametre varsayılanına katlıyor ve geri-yükleme ifadesinin değerini dalın değeri olarak bırakıyor — destructuring sonucu sayı değil, NaN de yanlış sayılıyor; aramanın istediği tam olarak bu. Hız sürümü <code>v=0</code>’dan başlıyor, şah testini yalnız terminalde bir kez hesaplıyor, geri-yüklemeye <code>,0</code> ekleyip düz bir sıfır döndürüyor, boş kareleri atlayan bir <code>!p||</code> koruması ekliyor ve terfi süzgecini önce hedef kareye bakan kısa devre biçimine (<code>f%56&gt;7||p&gt;&gt;1^4</code>) çeviriyor. Hız sürümü rok haklarını burada, <code>M</code>’in hemen öncesinde güncelliyor; böylece satır <code>L</code>’nin yalnızca denediği hamlelerde hiç çalışmıyor. Tahta kopyasını, kısa sürümde olduğu gibi, <code>M</code>’e bırakıyor.",

function tok(s){return s.match(/[A-Za-z_$][\w$]*|\d+n?|[\s\S]/g)||[]}
function ldiff(a,b){
  var n=a.length,m=b.length,dp=[],i,j;
  for(i=0;i<=n;i++)dp[i]=new Int32Array(m+1);
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:(dp[i+1][j]>=dp[i][j+1]?dp[i+1][j]:dp[i][j+1]);
  var out=[];i=0;j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){out.push([0,a[i]]);i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push([-1,a[i]]);i++} else {out.push([1,b[j]]);j++} }
  while(i<n)out.push([-1,a[i++]]);
  while(j<m)out.push([1,b[j++]]);
  var g=[],p;
  for(i=0;i<out.length;i++){ p=g[g.length-1];
    if(p&&p[0]===out[i][0])p[1]+=out[i][1]; else g.push([out[i][0],out[i][1]]) }
  return g}

function drawBoard(fen,flag,big){
  var board=String(fen).split(/\s+/)[0], sq=new Array(64).fill(0), rk=7, fl=0, k, ch, ty, out='';
  for(k=0;k<board.length;k++){ ch=board[k];
    if(ch=='/'){rk--;fl=0} else if(ch>='1'&&ch<='8'){fl+=+ch}
    else{ ty=VAL[ch.toLowerCase()]; if(ty&&rk>=0&&fl<8)sq[rk*8+fl]=ty*2+(ch==ch.toUpperCase()?1:0); fl++ } }
  for(rk=7;rk>=0;rk--)for(fl=0;fl<8;fl++){ var u=rk*8+fl,p=sq[u],cls=((fl+rk)%2)==0?'d':'l';
    if(p&1)cls+=' w';
    if(p>>1==5&&(p&1)===flag)cls+=' fk';
    out+='<i class="'+cls+'">'+(p?GLYPH[p>>1]:'')+
      (big&&fl==0?'<s class="rk">'+(rk+1)+'</s>':'')+(big&&rk==0?'<s class="fl">'+'abcdefgh'.charAt(fl)+'</s>':'')+'</i>' }
  return '<div class="bd'+(big?' big':'')+'" role="img" aria-label="'+esc(board)+'">'+out+'</div>'}

function parseTXT(text,f){

    if(!L||L.charAt(0)=='#')continue;

    var o={set:f.set,id:gi>=0?col[gi]:f.set+':'+i,fen:col[fi].trim(),file:f};

  say(F('fReading',esc(Array.prototype.map.call(list,function(f){return f.name}).join(', '))));
  Array.prototype.forEach.call(list,function(file){
    file.text().then(function(txt){
      var base=file.name.replace(/\.(csv|txt)$/i,''), set=base, n=2;
      while(files.some(function(x){return x.set===set}))set=base+' ('+(n++)+')';
      var f={key:++fileSeq,name:file.name,set:set,rows:[],bad:0,labs:0,ref:'none'};
      var P=(/\.txt$/i.test(file.name)||looksTXT(txt))?parseTXT(txt,f):parseCSV(txt,f);
      f.rows=P.rows; f.bad=P.bad;
      f.rows.forEach(function(r){if(r.lab)f.labs++});
      /* chasolver's wrongly-decided timeouts (and missed-draw exports of them) are draws by construction */
      if(!f.labs&&(/(^|,)lastMove(,|$)/.test(P.head)||/chasolver-data|missed-draws?/i.test(file.name)))f.ref='draw';
      files.push(f);

  else if(o.end&&o.end.ply<o.plies)o.cat=o.end.code=='DP'?'lateDP':'lateRule';
  else if(!o.end&&o.fin&&!o.fin.code)o.cat='unread';
  else if(o.res=='*')o.cat='open';
  else if(!o.end&&o.res=='1/2-1/2')o.cat='drawn';
  else if(o.res==o.right)o.cat='ok';
  else o.cat=!o.end&&o.right=='1/2-1/2'?'wrongtm':'wrongres';
  return o }

/* ---- input ---- */
function pgnPasted(){ var s=$('pgntext').value; return s.trim()?pgnSplit(s,'pasted'):[] }
function pgnAll(){ var g=pgnPasted(); PGN.files.forEach(function(f){ g=g.concat(f.games) }); return g }
function pgnRefresh(){
  var g=$('pgngo');
  if(PGN.busy){ g.textContent=T('goStop'); g.disabled=false; return }
  var n=pgnAll().length; g.textContent=n?F('pgnGo',num(n)):T('pgnGo0'); g.disabled=!n }
function pgnFiles(list){
  Array.prototype.forEach.call(list,function(file){
    file.text().then(function(txt){
      var f={key:++PGN.seq,name:file.name,games:pgnSplit(txt,file.name.replace(/\.pgn$/i,''))};
      PGN.files.push(f); pgnFileList(); pgnRefresh() }) }) }
function pgnFileList(){
  $('pgnflist').innerHTML=PGN.files.map(function(f){
    return '<li><span class="fname">'+esc(f.name)+'</span><span class="fmeta">'+F('pgnN',num(f.games.length))+'</span>'+
      '<button class="x" data-prm="'+f.key+'" aria-label="'+esc(F('fRemove',f.name))+'">×</button></li>' }).join('') }

/* ---- run ---- */
function pgnRun(){
  if(PGN.busy){ PGN.cancel=true; return }
  if(busy)return;
  var games=pgnAll(); if(!games.length)return;
  var key=$('eng').value, P=ply(), B=bud();
  loadEngine(key);
  PGN.busy=true; PGN.cancel=false; PGN.res=null; pgnLock(true); pgnRender();
  var res=[], i=0, T0=performance.now();
  $('pbar').style.display='block';
  (function chunk(){
    var until=performance.now()+50;
    do { res.push(pgnGame(games[i],P,B)); i++ } while(i<games.length&&!PGN.cancel&&performance.now()<until);
    var secs=(performance.now()-T0)/1000;
    $('pbarf').style.width=(100*i/games.length)+'%';
    $('pstat').textContent=F('pgnProg',num(i),num(games.length),num(Math.round(i/Math.max(secs,.001))));
    if(i<games.length&&!PGN.cancel)setTimeout(chunk,0);
    else { $('pbar').style.display='none';
      PGN.res=res; PGN.key=key; PGN.P=P; PGN.B=B; PGN.secs=secs; PGN.stopped=i<games.length;
      PGN.busy=false; PGN.page=0; PGN.filt=''; PGN.sel=-1; pgnLock(false); pgnRender() } })() }
function pgnLock(on){
  ['pgntext','eng','go'].forEach(function(id){ $(id).disabled=on });
  Array.prototype.forEach.call(document.querySelectorAll('#pgnflist button'),function(x){x.disabled=on});
  $('pdrop').classList.toggle('off',on); $('pgngo').classList.toggle('stop',on);
  if(!on)refreshCount(); pgnRefresh() }

/* ---- report ---- */
function pgnMoveNo(o,p){ var h=p-1+(o.s0?0:1); return (o.full0+(h>>1))+(h%2?'…':'.') }
/* a ply as the scoresheet writes it: 41.Bxe5 or 41…Kf6; ply 0 is the starting position */
function pgnRef(o,p){ return p?pgnMoveNo(o,p)+o.moves[p-1]:T('pd_startShort') }
function pgnEndText(o){ return o.end?pgnRef(o,o.end.ply)+' '+o.end.code:o.fin&&o.fin.code?o.fin.code:'' }
function pgnRender(){
  var R0=PGN.res, box=$('pgnout');
  if(!R0){ box.classList.add('hide'); if(!PGN.busy)$('pstat').textContent=''; return }
  box.classList.remove('hide');
  $('pstat').textContent=PGN.stopped?F('pgnStopped',num(R0.length),num(pgnAll().length)):F('pgnDone',num(R0.length),NAME[PGN.key],PGN.secs.toFixed(1));
  var cnt={}; PGN_CATS.forEach(function(k){cnt[k]=0}); R0.forEach(function(o){cnt[o.cat]++});
  $('pgnsum').innerHTML='<table><tr><th>'+T('pgnThCat')+'</th><th>'+T('pgnThN')+'</th></tr>'+
    PGN_CATS.filter(function(k){return cnt[k]}).map(function(k){
      return '<tr class="pc-'+k+'"><td>'+T('pc_'+k)+'</td><td>'+num(cnt[k])+'</td></tr>' }).join('')+'</table>';
  $('pgnfilt').innerHTML='<option value="">'+T('pgnFiltAll')+' ('+num(R0.length)+')</option>'+
    PGN_CATS.filter(function(k){return cnt[k]}).map(function(k){
      return '<option value="'+k+'"'+(PGN.filt==k?' selected':'')+'>'+T('pc_'+k)+' ('+num(cnt[k])+')</option>' }).join('');
  var list=[], k; for(k=0;k<R0.length;k++) if(!PGN.filt||R0[k].cat==PGN.filt)list.push(k);
  var per=50, pages=Math.max(1,Math.ceil(list.length/per)); if(PGN.page>=pages)PGN.page=pages-1;
  var h='<tr><th>#</th><th>'+T('pgnThGame')+'</th><th>'+T('pgnThPlayers')+'</th><th>'+T('pgnThRes')+'</th><th>'+T('pgnThTerm')+
        '</th><th>'+T('pgnThPlies')+'</th><th>'+T('pgnThEnd')+'</th><th>'+T('pgnThExtra')+'</th><th>'+T('pgnThRight')+'</th><th>'+T('pgnThCat')+'</th></tr>';
  list.slice(PGN.page*per,(PGN.page+1)*per).forEach(function(k){ var o=R0[k], g=o.tags;
    h+='<tr class="pc-'+o.cat+(k==PGN.sel?' act':'')+'" data-pk="'+k+'" tabindex="0"><td>'+(k+1)+'</td><td>'+esc(o.set)+' · '+esc(o.id)+'</td><td>'+
       esc((g.White||'?')+' – '+(g.Black||'?'))+'</td><td>'+esc(o.res)+'</td><td>'+esc(g.Termination||'')+'</td><td>'+num(o.plies)+
       '</td><td>'+esc(pgnEndText(o))+'</td><td>'+(o.end&&o.end.ply<o.plies?num(o.plies-o.end.ply):'')+'</td><td>'+esc(o.right)+
       '</td><td>'+T('pc_'+o.cat)+'</td></tr>' });
  $('pgntab').innerHTML=h;
  $('pgnpg').innerHTML=pages>1?'<button class="ghost" data-ppg="-1"'+(PGN.page?'':' disabled')+'>'+T('prev')+'</button><span>'+
    F('pgOf',PGN.page+1,pages,num(list.length))+'</span><button class="ghost" data-ppg="1"'+(PGN.page<pages-1?'':' disabled')+'>'+T('next')+'</button>':'';
  pgnDetail() }
function pgnErrText(err){
  if(err.k=='badstart')return F('perr_badstart',badText(err.p));
  if(err.k=='variant')return F('perr_variant',esc(err.a[0]));
  if(err.k=='parse')return T('perr_parse');
  return F('perr_'+err.k,num(err.a[0]),esc(err.a[1])) }
function pgnDetail(){
  var box=$('pgndet'), o=PGN.res&&PGN.res[PGN.sel];
  if(!o){ box.innerHTML=''; return }
  var g=o.tags, fen=o.end?o.end.fen:o.fen, flag=o.fin?o.fin.side:-1, h='<h3>'+esc(o.set)+' · '+esc(o.id)+'</h3><p class="note">';
  if(o.err)h+=pgnErrText(o.err)+(o.end?' '+F('pd_endFirst',pgnRef(o,o.end.ply),T('c_'+o.end.code)):'');
  else if(o.end&&o.end.ply<o.plies)h+=o.end.ply?F('pd_late',pgnRef(o,o.end.ply),T('c_'+o.end.code),num(o.plies-o.end.ply))
                                              :F('pd_lateStart',T('c_'+o.end.code),num(o.plies));
  else if(o.end)h+=o.end.ply?F('pd_here',pgnRef(o,o.end.ply),T('c_'+o.end.code)):F('pd_hereStart',T('c_'+o.end.code));
  else if(o.fin)h+=F('pd_final',sideName(o.fin.side),o.fin.code?T('c_'+o.fin.code):badText(o.fin.bad));
  h+='</p><div class="pdet">'+(fen?drawBoard(fen,flag,true):'')+'<div><dl class="kv">'+
    '<dt>'+T('pk_players')+'</dt><dd>'+esc((g.White||'?')+' – '+(g.Black||'?'))+'</dd>'+
    '<dt>'+T('pk_res')+'</dt><dd>'+esc(o.res)+(g.Termination?' ('+esc(g.Termination)+')':'')+'</dd>'+
    '<dt>'+T('pk_right')+'</dt><dd>'+esc(o.right||'—')+'</dd>'+
    '<dt>'+T('pk_claims')+'</dt><dd>'+F('pd_claims',o.c50?pgnRef(o,o.c50):'—',o.c3?pgnRef(o,o.c3):'—')+'</dd></dl>';
  if(fen){ var lid=o.lid?'https://lichess.org/'+o.lid:'';
    h+='<p class="fenbox">'+esc(fen)+'</p><div class="acts"><button class="ghost cp" data-fen="'+esc(fen)+'">'+T('lbCopy')+'</button>'+
       '<a class="btn" target="_blank" rel="noopener" href="'+esc(editor(fen))+'">'+T('openEditor')+'</a>'+
       (lid?'<a class="btn" target="_blank" rel="noopener" href="'+lid+(o.end?'#'+o.end.ply:'')+'">'+T('openGame')+'</a>':'')+'</div>' }
  h+='</div></div><h4>'+T('pk_moves')+'</h4><p class="mvs">';
  o.moves.forEach(function(m,k){ var p=k+1, cls=o.end&&p==o.end.ply?'e':o.end&&p>o.end.ply?'a':o.err&&o.err.a&&p==o.err.a[0]?'x':'';
    var h2=p-1+(o.s0?0:1); if(h2%2==0||k==0)h+='<span class="n">'+pgnMoveNo(o,p)+'</span>';
    h+='<span'+(cls?' class="'+cls+'"':'')+'>'+esc(m)+'</span> ' });
  box.innerHTML=h+'</p>' }
$('pgntab').addEventListener('click',function(ev){ var r=ev.target.closest('tr[data-pk]'); if(!r)return;
  PGN.sel=+r.getAttribute('data-pk'); pgnRender(); $('pgndet').scrollIntoView({behavior:'smooth',block:'nearest'}) });
$('pgntab').addEventListener('keydown',function(ev){ if(ev.key=='Enter'||ev.key==' '){ var r=ev.target.closest('tr[data-pk]'); if(r){ev.preventDefault();r.click()} } });
$('pgnpg').addEventListener('click',function(ev){ var x=ev.target.closest('[data-ppg]'); if(!x||x.disabled)return; PGN.page+=+x.getAttribute('data-ppg'); pgnRender() });
$('pgnfilt').onchange=function(){ PGN.filt=this.value; PGN.page=0; pgnRender() };
$('pgngo').onclick=pgnRun;
$('pgntext').addEventListener('input',function(){ clearTimeout(this._t); this._t=setTimeout(pgnRefresh,200) });
$('pgnflist').addEventListener('click',function(ev){ var x=ev.target.closest('[data-prm]'); if(!x||PGN.busy)return;
  PGN.files=PGN.files.filter(function(f){return f.key!=x.getAttribute('data-prm')}); pgnFileList(); pgnRefresh() });
(function(){ var d=$('pdrop'), f=$('pfile');
  d.onclick=function(){ if(!PGN.busy)f.click() };
  d.onkeydown=function(ev){ if(ev.key=='Enter'||ev.key==' '){ev.preventDefault(); if(!PGN.busy)f.click()} };
  f.onchange=function(){ if(f.files.length)pgnFiles(f.files); f.value='' };
  d.ondragover=function(ev){ ev.preventDefault(); if(!PGN.busy)d.classList.add('over') };
  d.ondragleave=function(){ d.classList.remove('over') };
  d.ondrop=function(ev){ ev.preventDefault(); d.classList.remove('over'); if(!PGN.busy&&ev.dataTransfer.files.length)pgnFiles(ev.dataTransfer.files) } })();
$('pgnexp').onclick=function(){ if(!PGN.res)return;
  var o=['build,set,gameId,white,black,result,termination,plies,finding,end_ply,end_move,end_code,extra_plies,correct,final_verdict,flag_side,claim50_ply,claim3R_ply,error,fen_at_end'];
  PGN.res.forEach(function(r){ var g=r.tags;
    o.push([NAME[PGN.key],r.set,r.id,g.White||'',g.Black||'',r.res,g.Termination||'',r.plies,r.cat,
      r.end?r.end.ply:'',r.end&&r.end.ply?pgnRef(r,r.end.ply):'',r.end?r.end.code:'',r.end&&r.end.ply<r.plies?r.plies-r.end.ply:'',
      r.right,r.fin?r.fin.code:'',r.fin?(r.fin.side?'w':'b'):'',r.c50||'',r.c3||'',
      r.err?r.err.k+(r.err.a?':'+r.err.a.join(':'):''):'',r.end?r.end.fen:r.fen||''].map(function(x){
        x=String(x); return /[",]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x }).join(',')) });
  download('pgn-results.csv',o.join('\n')) };

/* ================= wiring ================= */
function limNote(){ var f=fam($('eng').value), d=DEFS[f]; $('limnote').textContent=F('limNote',f?'L3':'LUX',d[0],num(d[1])) }
function applyI18n(){
  document.documentElement.lang=lang;
  document.title=T('title');
  var els=document.querySelectorAll('[data-i]'),i,el,k;
  for(i=0;i<els.length;i++){ el=els[i]; k=el.getAttribute('data-i');
    if(el.hasAttribute('data-ihtml'))el.innerHTML=T(k); else el.textContent=T(k) }
  if(cur)$('engnote').textContent=F('engnote',num(SRC[cur].length),tagOf(cur));
  limNote(); renderCodes(); inputChanged();
  if($('fold-diff').open)renderDiff();
  if(results){ var s=$('stat').innerHTML; showResults(); if(busy)say(s) }
  if(!$('lb').classList.contains('hide'))lbShow();
  pgnRefresh(); if(PGN.res)pgnRender() }
$('fold-diff').addEventListener('toggle',function(){ if(this.open)renderDiff() });
$('eng').onchange=function(){
  var el=$('eng'); if(busy||PGN.busy){el.value=cur;return}
  var was=DEFS[fam(cur)], now=DEFS[fam(el.value)];
  /* switching engine: fields still at the old engine's own limits follow the new one's */
  if(was!==now){ if(ply()===was[0])$('ply').value=now[0]; if(bud()===was[1])$('bud').value=now[1] }
  limNote();
  loadEngine(el.value);
  if(results&&snap[el.value]&&snap[el.value].res.length===results.res.length){
    var S=snap[el.value]; results={rows:results.rows,total:results.total,res:S.res,key:el.value,secs:S.secs,P:S.P,B:S.B,stopped:results.stopped};
    page=0; showResults(); return }
  if(results&&results.total===1){ go(); return }
  if(results){ results=null; snap={}; showResults(); say(F('sStale',esc(NAME[el.value]))) } };
$('lang').onchange=function(){ lang=$('lang').value; diffDone=''; applyI18n() };
$('eng').value='x4'; $('lang').value=(navigator.language||'').slice(0,2)=='tr'?'tr':'en'; lang=$('lang').value;
loadEngine('x4');
applyI18n();
})();
</script>
